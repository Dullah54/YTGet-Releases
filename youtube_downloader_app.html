<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTGet — YouTube Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --yt: #FF0000;
      --yt-dark: #CC0000;
      --bg: #f5f5f0;
      --card: #ffffff;
      --border: rgba(0, 0, 0, 0.12);
      --text: #1a1a1a;
      --muted: #666;
      --hint: #aaa;
      --surface: #f0f0ea;
      --surface2: #e8e8e2;
      --mono: 'DM Mono', monospace;
      --sans: 'Familjen Grotesk', sans-serif;
      --radius: 12px;
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #111;
        --card: #1c1c1c;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f0f0f0;
        --muted: #999;
        --hint: #555;
        --surface: #232323;
        --surface2: #2a2a2a;
      }
    }

    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--bg);
      min-height: 100vh
    }

    a {
      color: var(--yt);
      text-decoration: none
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem
    }

    .header {
      text-align: center;
      margin-bottom: 2rem
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--yt);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .play-tri {
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 16px solid white;
      margin-left: 3px
    }

    .logo-text {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px
    }

    .header p {
      font-size: 14px;
      color: var(--muted)
    }

    .card {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem
    }

    .card+.card {
      margin-top: 1rem
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 0.75rem
    }

    .url-input {
      flex: 1;
      font-family: var(--mono);
      font-size: 13px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s
    }

    .url-input:focus {
      border-color: var(--yt);
      box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1)
    }

    .url-input::placeholder {
      color: var(--hint)
    }

    .btn {
      padding: 11px 20px;
      border-radius: 8px;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      white-space: nowrap
    }

    .btn-primary {
      background: var(--yt);
      color: #fff
    }

    .btn-primary:hover {
      background: var(--yt-dark);
      transform: translateY(-1px)
    }

    .btn-primary:active {
      transform: translateY(0)
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border)
    }

    .btn-ghost:hover {
      background: var(--surface)
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 12px;
      border-radius: 6px
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem
    }

    .format-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 1rem;
      flex-wrap: wrap
    }

    .tab {
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      transition: all 0.15s;
      font-family: var(--sans)
    }

    .tab.active {
      background: var(--yt);
      color: #fff;
      border-color: var(--yt)
    }

    .tab:hover:not(.active) {
      background: var(--surface);
      color: var(--text)
    }

    .quality-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 1rem
    }

    .quality-opt {
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--surface)
    }

    .quality-opt:hover {
      border-color: var(--yt)
    }

    .quality-opt.selected {
      border-color: var(--yt);
      background: rgba(255, 0, 0, 0.08)
    }

    .quality-opt .q-label {
      font-size: 15px;
      font-weight: 700;
      display: block
    }

    .quality-opt .q-sub {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: 2px
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      background: rgba(255, 0, 0, 0.12);
      color: var(--yt);
      margin-top: 3px
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 1rem
    }

    .toggle-opt {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      color: var(--muted)
    }

    .toggle-opt input {
      accent-color: var(--yt);
      width: 15px;
      height: 15px;
      cursor: pointer
    }

    .toggle-opt.on {
      color: var(--text)
    }

    .preview-box {
      background: var(--surface);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 1rem
    }

    .thumb-wrap {
      width: 110px;
      min-width: 110px;
      height: 64px;
      border-radius: 7px;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .thumb-placeholder {
      font-size: 24px;
      color: #666
    }

    .duration-badge {
      position: absolute;
      bottom: 3px;
      right: 3px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 10px;
      font-family: var(--mono);
      padding: 1px 5px;
      border-radius: 3px
    }

    .meta {
      flex: 1;
      min-width: 0
    }

    .meta-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 5px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical
    }

    .meta-sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 2
    }

    .meta-sub span {
      margin-right: 12px
    }

    .progress-wrap {
      margin-top: 0.75rem
    }

    .progress-bar-bg {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--yt), #ff6b35);
      border-radius: 3px;
      transition: width 0.3s ease;
      width: 0%
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      font-family: var(--mono)
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-top: 0.75rem
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0
    }

    .dot.idle {
      background: var(--hint)
    }

    .dot.loading {
      background: #f59e0b;
      animation: pulse 1s infinite
    }

    .dot.ready {
      background: #10b981
    }

    .dot.error {
      background: var(--yt)
    }

    .dot.downloading {
      background: #3b82f6;
      animation: pulse 0.8s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      margin-bottom: 6px
    }

    .qi-thumb {
      width: 54px;
      height: 32px;
      border-radius: 5px;
      background: var(--surface);
      object-fit: cover;
      flex-shrink: 0
    }

    .qi-info {
      flex: 1;
      min-width: 0
    }

    .qi-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .qi-meta {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono)
    }

    .qi-status {
      font-size: 11px;
      font-weight: 600;
      min-width: 70px;
      text-align: right
    }

    .qi-status.done {
      color: #10b981
    }

    .qi-status.err {
      color: var(--yt)
    }

    .qi-status.prog {
      color: #3b82f6
    }

    .qi-bar {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 3px;
      overflow: hidden
    }

    .qi-bar-fill {
      height: 100%;
      background: #3b82f6;
      border-radius: 2px;
      transition: width 0.3s
    }

    .qi-rm {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--hint);
      font-size: 18px;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
      flex-shrink: 0
    }

    .qi-rm:hover {
      color: var(--yt);
      background: rgba(255, 0, 0, 0.08)
    }

    .empty-queue {
      text-align: center;
      padding: 2rem;
      color: var(--hint);
      font-size: 13px
    }

    .empty-icon {
      font-size: 32px;
      display: block;
      margin-bottom: 8px
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 1rem
    }

    .stat-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 0.75rem 1rem
    }

    .stat-val {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--mono);
      line-height: 1.2
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5
    }

    .alert-warn {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #92400e
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #065f46
    }

    @media(prefers-color-scheme:dark) {
      .alert-warn {
        color: #fcd34d
      }

      .alert-success {
        color: #6ee7b7
      }
    }

    .tabs-main {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
      gap: 0
    }

    .tab-main {
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      font-family: var(--sans)
    }

    .tab-main.active {
      color: var(--yt);
      border-bottom-color: var(--yt)
    }

    .tab-main:hover:not(.active) {
      color: var(--text)
    }

    .panel {
      display: none
    }

    .panel.visible {
      display: block
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      margin-bottom: 6px;
      font-size: 13px
    }

    .history-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .history-meta {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      min-width: 80px;
      text-align: right
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <div class="play-tri"></div>
        </div>
        <span class="logo-text">YTGet Web</span>
      </div>
      <p>Fast, clean YouTube downloader — video, audio, subtitles &amp; more</p>
    </div>

    <div id="main-alert" class="alert alert-warn">
      <span>⚠️</span>
      <span id="alert-msg"><strong>Connecting to server...</strong> Make sure server.py is running.</span>
    </div>

    <div class="card">
      <div class="tabs-main"
        style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0px;">
        <div style="display: flex; gap: 0;">
          <button class="tab-main active" onclick="switchTab('download')">Download</button>
          <button class="tab-main" onclick="switchTab('queue')">Queue <span id="q-badge"></span></button>
          <button class="tab-main" onclick="switchTab('history')">History</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="update-btn" onclick="updateEngine()"
          style="margin-bottom: 10px; color: var(--muted);"
          title="Fixes download errors by updating the background engine">🔄 Update Engine</button>
      </div>


      <div id="panel-download" class="panel visible">
        <div class="input-row">
          <input class="url-input" id="url-input" type="text"
            placeholder="Paste YouTube URL — video, playlist, or shorts..." autocomplete="off" />
          <button class="btn btn-primary" id="fetch-btn" onclick="fetchInfo()">Analyze</button>
        </div>

        <div class="status-row">
          <span class="dot idle" id="status-dot"></span>
          <span id="status-text" style="color:var(--muted)">Waiting for URL</span>
        </div>

        <div id="preview-area" style="display:none;margin-top:1.25rem">
          <div class="preview-box">
            <div class="thumb-wrap">
              <img id="thumb-img" src="" alt=""
                onerror="this.style.display='none';document.getElementById('thumb-ph').style.display='flex'" />
              <div id="thumb-ph" class="thumb-placeholder" style="display:none">▶</div>
              <span class="duration-badge" id="duration-badge">--:--</span>
            </div>
            <div class="meta">
              <div class="meta-title" id="meta-title">—</div>
              <div class="meta-sub">
                <span id="meta-channel">—</span>
                <span id="meta-views">—</span>
                <span id="meta-date">—</span>
              </div>
            </div>
          </div>

          <div class="section-label">Format</div>
          <div class="format-tabs" id="format-tabs">
            <button class="tab active" onclick="setFormat('video',this)">🎬 Video + Audio</button>
            <button class="tab" onclick="setFormat('audio',this)">🎵 Audio only</button>
            <button class="tab" onclick="setFormat('video_only',this)">📹 Video only</button>
            <button class="tab" onclick="setFormat('subs',this)">💬 Subtitles</button>
          </div>

          <div id="quality-panel">
            <div class="section-label">Quality</div>
            <div class="quality-grid" id="quality-grid"></div>
          </div>

          <div class="section-label">Options</div>
          <div class="options-row">
            <label class="toggle-opt"><input type="checkbox" id="opt-subs" onchange="updateOpts()"> Embed
              subtitles</label>
            <label class="toggle-opt"><input type="checkbox" id="opt-thumb" onchange="updateOpts()"> Embed
              thumbnail</label>
            <label class="toggle-opt"><input type="checkbox" id="opt-meta" checked onchange="updateOpts()"> Embed
              metadata</label>
            <label class="toggle-opt"><input type="checkbox" id="opt-chapters" onchange="updateOpts()"> Embed
              chapters</label>
            <label class="toggle-opt"><input type="checkbox" id="opt-sponsor" onchange="updateOpts()"> Skip
              SponsorBlock</label>
            <label class="toggle-opt"><input type="checkbox" id="opt-playlist" onchange="updateOpts()"> Download
              playlist</label>
          </div>

          <div id="progress-area" style="display:none">
            <div class="progress-wrap">
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="prog-fill"></div>
              </div>
              <div class="progress-meta">
                <span id="prog-pct">0%</span>
                <span id="prog-speed">—</span>
                <span id="prog-eta">ETA —</span>
              </div>
            </div>
          </div>

          <div style="display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap">
            <button class="btn btn-primary" id="dl-btn" onclick="startDownload()" style="flex:1;min-width:120px">⬇
              Download</button>
            <button class="btn btn-ghost" onclick="addToQueue()">+ Add to Queue</button>
            <button class="btn btn-ghost btn-sm" onclick="openInYT()" title="Open in YouTube">↗ Open</button>
          </div>
        </div>
      </div>


      <div id="panel-queue" class="panel">
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-val" id="stat-total">0</div>
            <div class="stat-lbl">Queued</div>
          </div>
          <div class="stat-card">
            <div class="stat-val" id="stat-done" style="color:#10b981">0</div>
            <div class="stat-lbl">Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-val" id="stat-err" style="color:var(--yt)">0</div>
            <div class="stat-lbl">Errors</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:0.75rem;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="processQueue()">▶ Start all</button>
          <button class="btn btn-ghost btn-sm" onclick="clearDone()">Clear done</button>
          <button class="btn btn-ghost btn-sm" onclick="clearQueue()">Clear all</button>
        </div>
        <div id="queue-list"></div>
      </div>


      <div id="panel-history" class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
          <span class="section-label" style="margin:0">Download history</span>
          <button class="btn btn-ghost btn-sm" onclick="clearHistory()">Clear history</button>
        </div>
        <div id="history-list"></div>
      </div>
    </div>
  </div>

  <script>
    // IMPORTANT: If you host this on a real website, change this to your server's public URL
    const API = 'http://localhost:9876';

    let state = {
      format: 'video', quality: 'best',
      opts: { meta: true }, videoMeta: null,
      queue: [], statDone: 0, statErr: 0,
      history: JSON.parse(localStorage.getItem('ytget-history') || '[]')
    };

    const videoQualities = [
      { label: '4K', sub: '2160p', val: '2160', badge: 'UHD' },
      { label: '2K', sub: '1440p', val: '1440', badge: 'QHD' },
      { label: '1080p', sub: 'Full HD', val: '1080', badge: 'FHD' },
      { label: '720p', sub: 'HD', val: '720' },
      { label: '480p', sub: 'SD', val: '480' },
      { label: '360p', sub: 'Low', val: '360' },
      { label: 'Best', sub: 'Auto', val: 'best', badge: 'REC' },
    ];
    const audioQualities = [
      { label: '320k', sub: 'MP3', val: '320' },
      { label: '256k', sub: 'AAC', val: '256' },
      { label: '192k', sub: 'MP3', val: '192' },
      { label: '128k', sub: 'Low', val: '128' },
      { label: 'FLAC', sub: 'Lossless', val: 'flac', badge: 'HQ' },
      { label: 'Best', sub: 'Auto', val: 'best', badge: 'REC' },
    ];

    function switchTab(tab) {
      ['download', 'queue', 'history'].forEach(t => {
        document.getElementById('panel-' + t).classList.toggle('visible', t === tab);
      });
      document.querySelectorAll('.tab-main').forEach((el, i) => {
        el.classList.toggle('active', ['download', 'queue', 'history'][i] === tab);
      });
      if (tab === 'queue') renderQueue();
      if (tab === 'history') renderHistory();
    }

    function setStatus(type, msg) {
      const dot = document.getElementById('status-dot');
      const txt = document.getElementById('status-text');
      dot.className = 'dot ' + type;
      txt.textContent = msg;
      txt.style.color = type === 'error' ? 'var(--yt)' : type === 'ready' ? '#10b981' : type === 'downloading' ? '#3b82f6' : 'var(--muted)';
    }

    function setFormat(f, btn) {
      state.format = f;
      document.querySelectorAll('.format-tabs .tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderQualities();
      document.getElementById('quality-panel').style.display = f === 'subs' ? 'none' : 'block';
    }

    function renderQualities() {
      const grid = document.getElementById('quality-grid');
      const opts = state.format === 'audio' ? audioQualities : videoQualities;
      grid.innerHTML = opts.map(q => `
        <div class="quality-opt${state.quality === q.val ? ' selected' : ''}" onclick="selectQuality('${q.val}',this)">
          <span class="q-label">${q.label}</span>
          <span class="q-sub">${q.sub}</span>
          ${q.badge ? `<span class="badge">${q.badge}</span>` : ''}
        </div>`).join('');
    }

    function selectQuality(val, el) {
      state.quality = val;
      document.querySelectorAll('.quality-opt').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
    }

    function updateOpts() {
      state.opts = {
        subs: document.getElementById('opt-subs').checked,
        thumb: document.getElementById('opt-thumb').checked,
        meta: document.getElementById('opt-meta').checked,
        chapters: document.getElementById('opt-chapters').checked,
        sponsor: document.getElementById('opt-sponsor').checked,
        playlist: document.getElementById('opt-playlist').checked,
      };
    }

    async function fetchInfo() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) { setStatus('error', 'Please paste a YouTube URL'); return; }
      if (!url.includes('youtube.com') && !url.includes('youtu.be')) { setStatus('error', 'Not a valid YouTube URL'); return; }
      setStatus('loading', 'Fetching video info...');
      document.getElementById('fetch-btn').disabled = true;
      document.getElementById('preview-area').style.display = 'none';
      try {
        const r = await fetch(`${API}/info?url=${encodeURIComponent(url)}`, { signal: AbortSignal.timeout(10000) });
        if (!r.ok) throw new Error('Server returned error');
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        state.videoMeta = d;
        populateMeta(d);
        setStatus('ready', 'Ready to download');
      } catch (e) {
        setStatus('error', 'Failed to fetch. YouTube might be blocking the server without cookies.');
      }
      document.getElementById('fetch-btn').disabled = false;
    }

    function populateMeta(d) {
      document.getElementById('preview-area').style.display = 'block';
      document.getElementById('meta-title').textContent = d.title || 'Unknown';
      document.getElementById('meta-channel').textContent = d.channel || '—';
      document.getElementById('meta-views').textContent = d.views ? formatNum(d.views) + ' views' : '—';
      document.getElementById('meta-date').textContent = formatDate(d.date) || '—';
      document.getElementById('duration-badge').textContent = d.duration || '--:--';
      const img = document.getElementById('thumb-img');
      img.style.display = 'block';
      document.getElementById('thumb-ph').style.display = 'none';
      img.src = d.thumb || (d.id ? `https://img.youtube.com/vi/${d.id}/mqdefault.jpg` : '');
      renderQualities();
      setTimeout(() => {
        const bestEl = document.querySelector(`.quality-opt[onclick*="${state.quality}"]`);
        if (bestEl) bestEl.classList.add('selected');
      }, 50);
    }

    function formatNum(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
      return String(n);
    }

    function formatDate(s) {
      if (!s || s.length !== 8) return s;
      return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
    }

    function openInYT() {
      const url = document.getElementById('url-input').value.trim();
      if (url) window.open(url, '_blank');
    }

    async function startDownload() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) { setStatus('error', 'No URL entered'); return; }

      const progressArea = document.getElementById('progress-area');
      const fill = document.getElementById('prog-fill');
      const pct = document.getElementById('prog-pct');
      const spd = document.getElementById('prog-speed');
      const eta = document.getElementById('prog-eta');

      progressArea.style.display = 'block';
      fill.style.width = '0%'; pct.textContent = '0%'; spd.textContent = '—'; eta.textContent = 'ETA —';
      setStatus('downloading', 'Processing on server...');
      document.getElementById('dl-btn').disabled = true;

      try {
        const res = await fetch(`${API}/download`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, format: state.format, quality: state.quality, opts: state.opts })
        });

        if (!res.ok) throw new Error('Server error');

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const lines = decoder.decode(value).split('\n');

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const p = JSON.parse(line);
              if (p.percent != null) { fill.style.width = Math.min(p.percent, 100) + '%'; pct.textContent = Math.round(p.percent) + '%'; }
              if (p.speed) spd.textContent = p.speed;
              if (p.eta) eta.textContent = 'ETA ' + p.eta;

              if (p.status === 'done') {
                setStatus('ready', '✓ Server finished! Passing file to your browser...');
                fill.style.width = '100%'; pct.textContent = '100%'; spd.textContent = 'done'; eta.textContent = '';

                // FIX: Pass the safe video title in the URL
                if (p.filename) {
                  const vidTitle = state.videoMeta?.title || 'youtube_video';
                  window.location.href = `${API}/serve_file?filename=${encodeURIComponent(p.filename)}&title=${encodeURIComponent(vidTitle)}`;
                }

                addToHistory(url, state.videoMeta?.title || url, state.format, state.quality);
              }
              if (p.status === 'error') throw new Error(p.message || 'Server-side download failed');
            } catch (e) { }
          }
        }
      } catch (e) {
        setStatus('error', e.message || 'Connection lost');
      }
      document.getElementById('dl-btn').disabled = false;
    }

    function addToHistory(url, title, format, quality) {
      const entry = { url, title, format, quality, date: new Date().toLocaleString() };
      state.history.unshift(entry);
      if (state.history.length > 100) state.history.pop();
      localStorage.setItem('ytget-history', JSON.stringify(state.history));
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      if (!state.history.length) { list.innerHTML = '<div class="empty-queue"><span class="empty-icon">📂</span>No downloads yet</div>'; return; }
      list.innerHTML = state.history.map((h, i) => `
        <div class="history-item">
          <span style="font-size:16px">🎬</span>
          <span class="history-title" title="${h.url}">${h.title}</span>
          <span class="history-meta">${h.format} · ${h.quality}</span>
          <span class="history-meta" style="min-width:130px">${h.date}</span>
        </div>`).join('');
    }

    function clearHistory() {
      state.history = [];
      localStorage.setItem('ytget-history', '[]');
      renderHistory();
    }

    function addToQueue() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) return;
      const item = { id: Date.now(), url, title: state.videoMeta?.title || url.substring(0, 60), thumb: state.videoMeta?.thumb || '', format: state.format, quality: state.quality, opts: { ...state.opts }, status: 'queued', progress: 0 };
      state.queue.push(item);
      document.getElementById('q-badge').textContent = '(' + state.queue.length + ')';
      updateQueueStats();
      const btn = document.querySelector('[onclick="addToQueue()"]');
      const old = btn.textContent;
      btn.textContent = '✓ Added!';
      setTimeout(() => btn.textContent = old, 1500);
    }

    function renderQueue() {
      const list = document.getElementById('queue-list');
      updateQueueStats();
      if (!state.queue.length) { list.innerHTML = '<div class="empty-queue"><span class="empty-icon">📭</span>Queue is empty</div>'; return; }
      list.innerHTML = state.queue.map(item => `
        <div class="queue-item" id="qi-${item.id}">
          <img class="qi-thumb" src="${item.thumb}" onerror="this.style.background='var(--surface2)';this.removeAttribute('src')">
          <div class="qi-info">
            <div class="qi-title" title="${item.title}">${item.title}</div>
            <div class="qi-meta">${item.format} · ${item.quality === 'best' ? 'auto' : item.quality}</div>
            <div class="qi-bar"><div class="qi-bar-fill" style="width:${item.progress}%"></div></div>
          </div>
          <span class="qi-status ${item.status === 'done' ? 'done' : item.status === 'error' ? 'err' : item.status === 'downloading' ? 'prog' : ''}">${item.status}</span>
          <button class="qi-rm" onclick="removeQueueItem(${item.id})">×</button>
        </div>`).join('');
    }

    function removeQueueItem(id) {
      state.queue = state.queue.filter(i => i.id !== id);
      document.getElementById('q-badge').textContent = state.queue.length ? '(' + state.queue.length + ')' : '';
      renderQueue();
    }

    function clearDone() { state.queue = state.queue.filter(i => i.status !== 'done'); renderQueue(); }
    function clearQueue() { state.queue = []; document.getElementById('q-badge').textContent = ''; renderQueue(); }

    function updateQueueStats() {
      document.getElementById('stat-total').textContent = state.queue.length;
      document.getElementById('stat-done').textContent = state.statDone;
      document.getElementById('stat-err').textContent = state.statErr;
    }

    async function processQueue() {
      for (const item of state.queue.filter(i => i.status === 'queued')) {
        item.status = 'downloading'; renderQueue();
        try {
          const res = await fetch(`${API}/download`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: item.url, format: item.format, quality: item.quality, opts: item.opts })
          });
          if (!res.ok) throw new Error();

          const dataList = (await res.text()).split('\n').filter(Boolean).map(JSON.parse);
          const finalState = dataList[dataList.length - 1];

          if (finalState.status === 'done') {
            item.status = 'done'; item.progress = 100; state.statDone++;
            addToHistory(item.url, item.title, item.format, item.quality);

            // FIX: Also pass title for queued downloads
            if (finalState.filename) {
              const safeTitle = item.title || 'youtube_video';
              window.location.href = `${API}/serve_file?filename=${encodeURIComponent(finalState.filename)}&title=${encodeURIComponent(safeTitle)}`;
            }
          } else {
            throw new Error();
          }
        } catch (e) {
          item.status = 'error'; state.statErr++;
        }
        renderQueue();
      }
    }

    function updateAlert(connected) {
      const a = document.getElementById('main-alert');
      if (connected) {
        a.className = 'alert alert-success';
        document.getElementById('alert-msg').innerHTML = '<strong>✓ Server connected!</strong> Ready to download.';
      } else {
        a.className = 'alert alert-warn';
        document.getElementById('alert-msg').innerHTML = '<strong>✗ Cannot reach server.</strong> Is server.py running?';
      }
    }

    document.getElementById('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') fetchInfo(); });
    document.getElementById('url-input').addEventListener('paste', () => {
      setTimeout(() => {
        const v = document.getElementById('url-input').value.trim();
        if (v.includes('youtube.com') || v.includes('youtu.be')) fetchInfo();
      }, 80);
    });

    // Auto-test connection on load
    setTimeout(async () => {
      try {
        const r = await fetch(`${API}/ping`, { signal: AbortSignal.timeout(2000) });
        updateAlert(r.ok);
      } catch (e) { updateAlert(false); }
    }, 500);

    async function updateEngine() {
      const btn = document.getElementById('update-btn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Updating... (Please wait)';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/update`, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
          alert("✅ Update Successful!\n\nDetails:\n" + data.log);
        } else {
          alert("❌ Update Failed.\n\nDetails:\n" + data.log);
        }
      } catch (e) {
        alert("❌ Error: Could not connect to the server to update.");
      }

      btn.innerHTML = originalText;
      btn.disabled = false;
    }
  </script>
</body>

</html>
